name: PR checks

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

  source-branch:
    name: Source must be staging
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only staging may be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_REF" != "staging" ]; then
            echo "PRs into main must come from the staging branch (got $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi
